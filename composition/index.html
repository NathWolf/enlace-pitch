<script type="application/hyperframes-slideshow+json">{

      "sceneId": "S01",
      "startTime": 0,
      "endTime": 26.95,
      "notes": "Let the Enlace name register. Then begin the familiar exchange pattern.\nAirbnb makes spare rooms available to travelers. The familiar idea is that existing resources become available for exchange.\nUber does this with driver availability and ride requests, continuously. These are familiar examples, with their own operational and pricing constraints.\nEnlace brings a decision and pricing layer to logistics exchanges across independent companies. Here A’s six positions split between B and C. C also receives one from D. Every offered unit is accounted for. This is an illustrative allocation, not customer data. Our first product applies this principle inside private shipper networks, using their existing carriers.",
      "fragments": [
        0.8,
        6.35,
        11.9,
        26.95
      ]
    },
    {
      "sceneId": "S02",
      "startTime": 27,
      "endTime": 48,
      "notes": "This problem appears across logistics. In 2024, 21.6% of EU road-freight vehicle-km were travelled empty (Eurostat). The journey is illustrative; the figure does not measure return trips alone. A European Commission NMP study using 2021–22 data reports an average urban freight vehicle load factor of about 50% across 21 major European cities (Cartolano et al., 2025). Empty containers accumulate at surplus ports and must be repositioned to deficit ports. JMSE (2026) cites an industry estimate of $15–20 billion annually and a historical estimate of about 20% of ocean-container movements involving empties; neither is presented as a new 2026 measurement. These metrics have different scopes and cannot be added or treated as Enlace-addressable savings. The common coordination problem is that resources and demand sit across separate companies and networks, with distinct constraints and rules. Not all empty movements can be solved by exchanges. Warehouses and ships appear in the final visual without additional statistics.",
      "fragments": [
        35,
        42,
        48
      ]
    },
    {
      "sceneId": "S03",
      "startTime": 48.05,
      "endTime": 72.05,
      "notes": "Enlace provides the market mechanism for a private logistics market. Participants submit supply and demand, together with operational and contractual constraints. The market operator defines the rules. Enlace combines mathematical optimization and market design to clear the market: determining which transactions occur, what quantity, at what price and on what terms. In this illustrative animation, Carrier A offers four units and Carrier D two; Shippers B and C each request three. A supplies three units to B and one to C, while D supplies two to C. A candidate connection from D to B fails the constraint check. All six units retain their source colors. Euro-and-check marks represent prices and terms returned with the allocation, without asserting actual prices or customer results. Transport capacity is the initial example.",
      "fragments": [
        53.05,
        60.05,
        72.05
      ]
    },
    {
      "sceneId": "S04",
      "startTime": 72.1,
      "endTime": 81.1,
      "notes": "Different organizations can create an Enlace market, but they pay for different reasons. A company wants to reduce logistics cost. A 3PL can create a new service and monetize it. A consortium creates savings for its members. A public or infrastructure operator wants better use of capacity across its ecosystem. In every case, Enlace provides the market mechanism that lets the operator run that market. These are potential buyer categories and incentives, not claims of four validated customer segments. The initial go-to-market remains the design-partner market with two to three shippers.",
      "fragments": [
        74.1,
        81.1
      ]
    },
    {
      "sceneId": "S06",
      "startTime": 81.15,
      "endTime": 96.15,
      "notes": "We have agreed to start working with a design partner. We are now scoping the first market around two to three shippers with compatible freight lanes and their existing carriers. The goal is to prove repeatable capacity exchanges. Then we expand the market: more clients, more lanes, more participants and more resource types, opening new markets. The initial scope does not imply that all shippers are signed or live.",
      "fragments": [
        83.15,
        89.15,
        96.15
      ]
    },
    {
      "sceneId": "S05",
      "startTime": 96.2,
      "endTime": 104.2,
      "notes": "The proposed recurring platform model starts at €200,000 or more per year for a private logistics market. The fee grows with the number of participants and the number and type of resources coordinated. Deployment and integration are additional one-time work. The initial scope is transport capacity across a small group of shippers. The proposed fee is not contracted revenue. Possible later usage fees are in the appendix.",
      "fragments": [
        98.7,
        104.2
      ]
    },
    {
      "sceneId": "S07",
      "startTime": 104.25,
      "endTime": 112.25,
      "notes": "The global economic context is $3.8 trillion in road freight and $12.29 trillion in logistics costs in 2024. Logistics costs are estimated by Armstrong & Associates; road freight is a Frost & Sullivan estimate cited in an HKEX filing. These estimates use separate methodologies. The appendix sizes platform revenue from market count times annual fee.",
      "fragments": [
        106.75,
        112.25
      ]
    },
    {
      "sceneId": "S08",
      "startTime": 112.3,
      "endTime": 118.3,
      "notes": "Nathalia Wolf, CEO and co-founder: logistics and optimization, PhD in computer science and MSc Industrial Engineering. Juan Sepúlveda, CTO and co-founder: market design and optimization, PhD in computer science and MSc Electrical Engineering. Supported by Inria.",
      "fragments": [
        118.3
      ]
    },
    {
      "sceneId": "S10",
      "startTime": 118.35,
      "endTime": 124.35,
      "notes": "We are seeking €2M in seed funding for a 24-month runway covering productization, deployment and commercial validation. Core technology is complete. First live markets are in progress with design partners. Company creation is planned for March 2027. The funding is intended to produce repeatable deployment across multiple paying markets and validate willingness to pay. Multiple paying markets is the intended outcome, not a claim of current revenue.",
      "fragments": [
        120.85,
        124.35
      ]
    },
    {
      "sceneId": "S09",
      "startTime": 124.4,
      "endTime": 130.4,

      ]

  "slideSequences": [
    {
      "id": "appendix",
      "label": "Appendix",
      "slides": [
        {
          "sceneId": "A00",
          "startTime": 130.45,
          "endTime": 132.45,
          "notes": "Select a topic, or advance through the appendix with the arrow keys. Press A to return to the main pitch."
        },
        {
          "sceneId": "A04",
          "startTime": 132.5,
          "endTime": 134.5,
          "notes": "Simplified from the user-supplied comparison. Amazon Flex executes Amazon deliveries with independent drivers; it is not procurement for external shippers. Uber Freight supports procurement and explicitly documents multi-shipper co-loading and shared capacity. Shippers can bring preferred carriers and configure controls inside Uber Freight workflows; Uber Freight orchestrates its managed multi-shipper model. Transporeon supports shipper-defined carrier pools, allocation rules and transport processes. Its multi-shipper capacity-sharing entry is unconfirmed by the cited assignment material, not a claim that it cannot do it. Partial means customers configure transportation workflows, rather than establishing the broader customer-defined exchange described for Enlace. Enlace’s proposed scope gives the network owner control over participation, operational and economic rules, with the customer orchestrating and Enlace supplying the engine. Procurement is one possible network configuration. Transport is the initial resource; warehouses, shipping and container capacity are the wider vision. Public positioning is not an exhaustive feature audit. Sources: Amazon Flex; Uber Freight multi-shipper networks, Exchange and Managed Transportation; Transporeon Transport Assignment."
        },

          "sceneId": "D06",
          "startTime": 134.55,

        },
        {
          "sceneId": "D20",
          "startTime": 136.6,
          "endTime": 138.6,
          "notes": "User-provided planning allocation, not committed expenditure. Categories allocate seed capital; they are not a detailed operating-expense forecast. Reconcile hiring and project budgets to actual deployment and sales timing."
        },
        {
          "sceneId": "D22",
          "startTime": 138.65,
          "endTime": 140.65,
          "notes": "Seed assumed available at the start of 2027; opening cash assumed zero. EBITDA is a planning input. Cash flow approximates EBITDA less capex. Displayed values use the provided rounded base case. Revenue 2030 exact is €7.36M. Gross profit less EBITDA implies operating expenses €0.816M, €1.311M, €2.2464M, €4.7136M and €9.3054M. Lowest displayed year-end cash is €0.54M in 2029. This does not prove intra-year liquidity or that €2M is sufficient if sales, collections or gross margins miss plan."
        },
        {
          "sceneId": "D23",
          "startTime": 140.7,
          "endTime": 142.7,
          "notes": "Detailed model (year / live markets / average ARR in €k / ARR in €M / EBITDA in €M): 2027 / 2 / 220 / 0.44 / -0.64; 2028 / 6 / 240 / 1.44 / -0.57; 2029 / 15 / 260 / 3.9 / 0; 2030 / 32 / 285 / 9.12 / 0.88; 2031 / 60 / 310 / 18.6 / 2.75; 2032 / 100 / 335 / 33.5 / 5.6; 2033 / 155 / 360 / 55.8 / 10.4; 2034 / 225 / 385 / 86.625 / 17.9; 2035 / 310 / 410 / 127.1 / 27.8; 2036 / 400 / 435 / 174 / 38.8. 2036 recognized revenue assumption: average of €127.1M and €174M ARR plus 90 deployments × €50k = €155.05M. €38.8M EBITDA divided by €155.05M recognized revenue is 25.0%. EBITDA margin must not be calculated using year-end ARR. The ten-year model is a scenario, not evidence of achievable demand."
        },
        {
          "sceneId": "D25",
          "startTime": 142.75,
          "endTime": 144.75,
          "notes": "Proposed mitigations reduce risk but do not eliminate it. Track exchange completion and frequency, permission and onboarding friction, implementation hours, sales conversion and contract-cycle duration, plus legal constraints per jurisdiction."
        },
        {
          "sceneId": "A08",
          "startTime": 144.8,
          "endTime": 146.8,
          "notes": "Sources: https://www.3plogistics.com/wp-content/uploads/2026/06/Third-Party_Logistics_Market_Results_and_Trends_2026_5JUN2026.pdf ; https://www1.hkexnews.hk/app/sehk/2025/107809/documents/sehk25102701615.pdf ; https://doi.org/10.1080/13675567.2013.865719 ; https://doi.org/10.1111/jscm.12278 ; https://www.uberfreight.com/en-US/blog/increasing-shipper-carrier-collaboration-with-transplaces-planned-continuous-moves-lanehub-platform ; https://www.portbase.com/en/annual-reports/annual-report-2025/ ; https://transport.ec.europa.eu/transport-themes/logistics-and-multimodal-transport/efti-regulation_en ; https://dcsa.org/get-involved/100-percent-ebl ; https://www.iata.org/en/pressroom/2026-releases/2026-03-10-01/ ; https://www.benchmarkit.ai/2025benchmarks ; https://www.bvp.com/assets/uploads/2024/04/From-Start-to-Centaur-The-founders-roadmap-to-100-million-ARR-Bessemer-Books-Edition-040924.pdf . Full URLs and scope qualifications are recorded in SOURCES.md. Detailed arithmetic and machine-readable model data are in FINANCIAL-MODEL.md and output/data/financial-model.json. External studies are not Enlace forecasts. IP slide omitted at the user’s request."
        }
      ]
    }

  <script>
    gsap.registerPlugin(MotionPathPlugin);
    const deck=window.ENLACE_DECK;
    window.ENLACE_HOLD_TIMES=deck.times;
    const host=document.getElementById('states');
    host.innerHTML='<article id="state-TITLE" class="scene"><span class="title-logo enlace-wordmark">Enlace</span></article>'+deck.scenes.slice(1).map(s=>`<article class="scene" id="scene-${s.id}" data-scene-id="${s.id}">${s.id!=='S09'?`<p class="chapter-label">${s.chapter}</p>`:''}${window.ENLACE_PITCH_ART[s.id]}${s.source?`<p class="scene-source">${s.source}</p>`:''}<span class="scene-page">${s.number} / ${deck.scenes.length}</span></article>`).join('')+deck.appendix.map(s=>`<article class="scene appendix-scene" id="scene-${s.id}" data-scene-id="${s.id}"><p class="chapter-label">Appendix · ${s.label}</p><h1 class="scene-title">${s.headline}</h1><div class="appendix-body">${s.html}</div><span class="scene-page">${s.id}</span></article>`).join('');
    const tl=gsap.timeline({paused:true});
    tl.set('.scene',{autoAlpha:0},0);
    tl.set('#state-TITLE',{autoAlpha:1},0);
    tl.fromTo('.title-logo',{opacity:0,y:12},{opacity:1,y:0,duration:.64,ease:'power2.out'},.08);
    const visibleScenes=[...deck.scenes.slice(1),...deck.appendix];
    visibleScenes.forEach((s,i)=>{
      const el=document.getElementById('scene-'+s.id);
      // Crossfade scene handoffs at the same timestamp. The previous gap
      // briefly exposed an empty stage when advancing with the arrow keys.
      if(i)tl.to(document.getElementById('scene-'+visibleScenes[i-1].id),{autoAlpha:0,duration:.28,ease:'power2.in'},s.start);
      tl.fromTo(el,{autoAlpha:0},{autoAlpha:1,duration:.28,ease:'power2.out',immediateRender:false},s.start);
    });
    window.buildEnlaceOpening(tl,deck.times);
    window.buildPitchScenes(tl,deck.scenes);
    tl.set('#enlace-pitch',{opacity:1},deck.duration);
    window.__timelines=window.__timelines||{};
    window.__timelines['enlace-pitch']=tl;
  </script>
<script>
      document.addEventListener('keydown',event=>{
        if(window.parent===window || event.ctrlKey || event.metaKey || event.altKey || event.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;
        if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp','Backspace','Escape',' '].includes(event.key)||['a','r','p','f'].includes(event.key.toLowerCase())){
          event.preventDefault();event.stopImmediatePropagation();
          if(event.key.toLowerCase()==='f'){if(!parent.document.fullscreenElement)parent.document.documentElement.requestFullscreen?.();else parent.document.exitFullscreen?.();return;}
          parent.postMessage({type:'enlace-key',key:event.key,code:event.code,repeat:event.repeat},location.origin);
        }
      },true);
      document.addEventListener('click',event=>{const item=event.target.closest('[data-appendix-target]');if(item)parent.postMessage({type:'enlace-appendix',id:item.dataset.appendixTarget},location.origin);});
      </script></body>
