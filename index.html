<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enlace investor pitch</title>
    <script src="vendor/hyperframes-player.global.js"></script>
    <script src="composition/opening-scenes.js"></script>
    <script src="composition/deck-data.js"></script>
    <style>
      :root{--ink:#0b1024;--muted:#6f7482;--accent:#0b1024;--panel:#f4f4f5;--line:#dedfe4}
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{width:100%;height:100%;overflow:hidden;background:#f2f2f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
      #deck-shell{width:100%;height:100%;display:grid;grid-template-rows:1fr 74px;gap:0}
      #stage{position:relative;min-height:0;display:grid;place-items:center;background:#ececee}
      hyperframes-player{display:block;width:min(100%,calc((100vh - 74px) * 16 / 9));height:min(calc(100vw * 9 / 16),calc(100vh - 74px));background:#fff;box-shadow:0 20px 70px rgba(20,40,70,.18)}
      #controls{height:74px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;gap:18px}
      .control-group{min-width:0;display:flex;align-items:center;gap:10px}.control-group.center{justify-content:center}.control-group.right{justify-content:flex-end}
      button{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;min-width:44px;height:44px;padding:0 15px;font:700 15px/1 inherit;cursor:pointer}button:hover{background:var(--panel)}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.4;cursor:default}
      #position{font-size:14px;font-weight:750;color:var(--muted);min-width:120px;text-align:center}
      .download-pdf{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;height:44px;padding:0 15px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff;text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}.download-pdf:hover{background:var(--panel)}.download-pdf:focus-visible{outline:2px solid #126ac0;outline-offset:3px}
      #appendix-badge{display:none;padding:8px 12px;border-radius:999px;background:var(--panel);color:var(--ink);font-size:13px;font-weight:800}body.appendix #appendix-badge{display:inline-flex}
      #presenter-panel{display:none;position:absolute;right:18px;top:18px;bottom:18px;width:360px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px rgba(10,35,70,.22);padding:22px;z-index:20;overflow:auto}
      #presenter-panel h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:14px}#presenter-panel h3{font-size:25px;line-height:1.15;margin-bottom:16px}#presenter-note{font-size:17px;line-height:1.52;color:#34415a;white-space:pre-line}#next-label{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}#elapsed{position:absolute;right:22px;bottom:18px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
      body.presenter #stage{padding-right:390px}body.presenter #presenter-panel{display:block}body.presenter hyperframes-player{width:min(100%,calc((100vh - 74px) * 16 / 9));height:min(calc((100vw - 390px) * 9 / 16),calc(100vh - 74px))}
      body.audience #deck-shell{grid-template-rows:1fr}body.audience #controls{display:none}body.audience #stage{background:#000}body.audience hyperframes-player{width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));box-shadow:none}
      #loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:var(--muted);z-index:10;font-size:18px;transition:opacity .2s ease}body.ready #loading{opacity:0;pointer-events:none}
      @media(max-width:900px){#controls{grid-template-columns:1fr auto}.control-group.right{display:none}body.presenter #stage{padding-right:0}body.presenter #presenter-panel{width:calc(100% - 36px);top:auto;height:34%;bottom:88px}}
    @media(max-width:900px){.control-group.right{display:flex}.control-group.right #appendix,.control-group.right #present{display:none}#controls{grid-template-columns:1fr auto auto}#position{min-width:60px}#replay-scene{display:none}}
      :fullscreen #deck-shell{grid-template-rows:1fr}:fullscreen #stage{background:#000;padding:0}:fullscreen hyperframes-player{width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));box-shadow:none}:fullscreen #presenter-panel{display:none}:fullscreen #controls{position:fixed;bottom:0;left:0;right:0;z-index:50;opacity:0;transition:opacity .2s}:fullscreen #controls:hover,:fullscreen #controls:focus-within{opacity:1}
      </style>
  </head>
  <body>
    <main id="deck-shell">
      <section id="stage">
        <div id="loading">Loading Enlace pitch…</div>
        <hyperframes-player id="player" interactive src="composition/index.html"></hyperframes-player>
        <aside id="presenter-panel">
          <h2>Presenter notes</h2>
          <h3 id="note-title"></h3>
          <div id="presenter-note"></div>
          <div id="next-label"></div>
          <div id="elapsed">00:00</div>
        </aside>
      </section>
      <nav id="controls" aria-label="Presentation controls">
        <div class="control-group"><a class="download-pdf" id="download-main" href="output/pdf/enlace-investor-deck-main.pdf" download="Enlace-main-deck.pdf" title="Download the presentation without the appendix">Main PDF</a><a class="download-pdf" id="download-slides" href="output/pdf/enlace-investor-deck.pdf" download="Enlace-investor-deck.pdf" title="Download the main deck and appendix as a PDF">PDF + appendix</a><span id="appendix-badge">Appendix</span></div>
        <div class="control-group center"><button id="prev" aria-label="Previous beat">←</button><span id="position"></span><button id="next" class="primary" aria-label="Next beat">→</button><button id="replay-scene">Replay scene</button></div>
        <div class="control-group right"><button id="appendix">Appendix</button><button id="fullscreen">Fullscreen</button><button id="present" class="primary">Present</button></div>
      </nav>
    </main>
    <script>
      const player = document.getElementById("player");
      const mainHolds = window.ENLACE_DECK.main;
      const appendixHolds = window.ENLACE_DECK.appendix;
      const allHolds = [...mainHolds, ...appendixHolds];
      const FIRST_HOLD = 0.8;
      let holdCursor = FIRST_HOLD;
      const times = allHolds.map((hold, i) => {
        if (i > 0) holdCursor += Number(hold.advance || 1.45);
        return Number(holdCursor.toFixed(2));
      });
      const isAudience = new URLSearchParams(location.search).get("mode") === "audience";
      const channel = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("enlace-pitch:" + location.pathname) : null;
      let appendixMode = false;
      let index = 0;
      let pendingTarget = null;
      let openingPlayback = false;
      let continuousEnd = null;
      let savedMainIndex = 0;
      let ready = false;
      let startedAt = null;
      let timer = null;

      if (isAudience) document.body.classList.add("audience");

      function sequence(){ return appendixMode ? appendixHolds : mainHolds; }
      function globalIndex(){ return appendixMode ? mainHolds.length + index : index; }
      function currentHold(){ return sequence()[index]; }
      function currentTime(){ return times[globalIndex()]; }
      function clampIndex(value){ return Math.max(0, Math.min(sequence().length - 1, value)); }
      function formatTime(seconds){ const m=Math.floor(seconds/60); const s=Math.floor(seconds%60); return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }

      function updateUi(){
        const hold = currentHold();
        document.body.classList.toggle("appendix", appendixMode);
        document.getElementById("position").textContent = `${hold.sceneNumber} / ${appendixMode ? appendixHolds.length : window.ENLACE_DECK.scenes.length}`;
        document.getElementById("note-title").textContent = hold.label;
        document.getElementById("presenter-note").textContent = hold.note || "";
        const next = sequence()[index + 1];
        document.getElementById("next-label").textContent = next ? `Next: ${next.label}` : appendixMode ? "End of appendix" : "Next: Appendix contents";
        document.getElementById("prev").disabled = index === 0 && !appendixMode;
        document.getElementById("next").disabled = appendixMode && index === sequence().length - 1;
      }

      function exactSeek(target){ pendingTarget = null; player.pause?.(); player.seek?.(target); }
      function slideEntryTime(position){ return allHolds[position].entry; }
      function playCurrentSlide(target){
        if (!ready) return;
        const entry = Math.min(target, slideEntryTime(globalIndex()));
        exactSeek(entry);
        if (target <= entry + 0.03) return;
        pendingTarget = target;
        player.play?.();
      }
      function onTime(event){
        const value = Number(event.detail?.currentTime ?? player.currentTime ?? 0);
        if (continuousEnd !== null) {
          while(index < continuousEnd && value >= slideEntryTime(index + 1)) index++;
          updateUi();
        }
        if (pendingTarget !== null && value >= pendingTarget - 0.025) {
          openingPlayback = false;
          continuousEnd = null;
          exactSeek(pendingTarget);
        }
      }
      player.addEventListener("timeupdate", onTime);

      function go(nextIndex, animate = true, broadcast = true){
        openingPlayback = false;
        continuousEnd = null;
        index = clampIndex(nextIndex);
        const target = currentTime();
        if (animate) playCurrentSlide(target); else exactSeek(target);
        updateUi();
        if (broadcast) channel?.postMessage({type:"go", appendixMode, index, animate});
      }
      function next(){ if (index < sequence().length - 1) go(index + 1, true); else if (!appendixMode) toggleAppendix(); }
      function prev(){ if (index > 0) go(index - 1, false); else if (appendixMode) toggleAppendix(); }
      function toggleAppendix(broadcast = true){
        if (!appendixMode) savedMainIndex = index;
        appendixMode = !appendixMode;
        index = appendixMode ? 0 : savedMainIndex;
        go(index, false, false);
        if (broadcast) channel?.postMessage({type:"go", appendixMode, index, animate:false});
      }
      function replayScene(){
        if (!ready) return;
        if (appendixMode) { playCurrentSlide(currentTime()); return; }
        const sceneId=currentHold().sceneId;
        const first=mainHolds.findIndex(h=>h.sceneId===sceneId);
        const last=mainHolds.findLastIndex(h=>h.sceneId===sceneId);
        index=first;
        exactSeek(slideEntryTime(first));
        continuousEnd=last;
        pendingTarget=times[last];
        updateUi(); player.play?.(); sendPlaybackState();
      }
      function sendPlaybackState(){
        channel?.postMessage({
          type:"sync", appendixMode, index, openingPlayback, continuousEnd, pendingTarget,
          time:Number(player.currentTime ?? currentTime()),
        });
      }
      function enterPresenter(){
        if (isAudience) return;
        const audienceUrl = new URL(location.href);
        audienceUrl.searchParams.set("mode", "audience");
        audienceUrl.searchParams.delete("opening");
        window.open(audienceUrl.href, "enlace-audience");
        document.body.classList.add("presenter");
        startedAt = Date.now();
        if (!timer) timer = setInterval(() => { if (startedAt) document.getElementById("elapsed").textContent = formatTime((Date.now()-startedAt)/1000); }, 1000);
        [200,700,1500].forEach(delay => setTimeout(sendPlaybackState, delay));
      }
      async function toggleFullscreen(){
        try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.(); else await document.exitFullscreen?.(); }
        catch (error) { console.warn("Fullscreen request failed", error); }
      }
      document.addEventListener("fullscreenchange",()=>{document.getElementById("fullscreen").textContent=document.fullscreenElement?"Exit fullscreen":"Fullscreen";});

      channel?.addEventListener("message", event => {
        const msg = event.data;
        if (!msg) return;
        if (msg.type === "audience-ready" && !isAudience && ready) {
          sendPlaybackState();
          return;
        }
        if (msg.type === "sync" && isAudience && ready) {
          appendixMode = Boolean(msg.appendixMode);
          index = Math.max(0, Math.min(sequence().length - 1, Number(msg.index) || 0));
          exactSeek(Number(msg.time));
          openingPlayback = Boolean(msg.openingPlayback);
          continuousEnd = msg.continuousEnd == null ? null : Number(msg.continuousEnd);
          pendingTarget = msg.pendingTarget == null ? null : Number(msg.pendingTarget);
          updateUi();
          if (pendingTarget !== null) player.play?.();
          return;
        }
        if (msg.type !== "go") return;
        appendixMode = Boolean(msg.appendixMode);
        index = Math.max(0, Math.min(sequence().length - 1, Number(msg.index) || 0));
        go(index, Boolean(msg.animate), false);
      });

      function handleKey(event) {
        if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target?.isContentEditable || ["INPUT","TEXTAREA","SELECT"].includes(event.target?.tagName)) return;
        if (event.code === "Space" || ["ArrowRight","ArrowDown","PageDown"].includes(event.key)) { event.preventDefault(); next(); }
        else if (["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(event.key)) { event.preventDefault(); prev(); }
        else if (event.key.toLowerCase() === "r") { event.preventDefault(); replayScene(); }
        else if (event.key.toLowerCase() === "a") { event.preventDefault(); toggleAppendix(); }
        else if (event.key.toLowerCase() === "p") { event.preventDefault(); enterPresenter(); }
        else if (event.key.toLowerCase() === "f") { event.preventDefault(); toggleFullscreen(); }
        else if (event.key === "Escape" && appendixMode) { event.preventDefault(); toggleAppendix(); }
      }
      document.addEventListener("keydown", handleKey, true);
      window.addEventListener?.("message",event=>{
        if(event.origin!==location.origin || !event.data) return;
        if(event.data.type==="enlace-key")handleKey({...event.data,preventDefault(){}});
        if(event.data.type==="enlace-appendix"){
          const target=appendixHolds.findIndex(h=>h.id===event.data.id);
          if(target>=0){if(!appendixMode)savedMainIndex=index;appendixMode=true;go(target,false);}
        }
      });
      document.getElementById("replay-scene").addEventListener("click", replayScene);
      document.getElementById("next").addEventListener("click", next);
      document.getElementById("prev").addEventListener("click", prev);
      document.getElementById("appendix").addEventListener("click", () => toggleAppendix());
      document.getElementById("present").addEventListener("click", enterPresenter);
      document.getElementById("fullscreen").addEventListener("click", toggleFullscreen);

      async function initialize(){
        await customElements.whenDefined("hyperframes-player");
        const activate = () => {
          if (ready) return;
          ready = true;
          exactSeek(currentTime());
          document.body.classList.add("ready");
          updateUi();
          // The review link plays the complete logo-first opening continuously.
          if (new URLSearchParams(location.search).get("opening") === "1" && !isAudience) {
            index = 1;
            exactSeek(slideEntryTime(1));
            pendingTarget = times[3];
            openingPlayback = true;
            continuousEnd = 3;
            updateUi();
            player.play?.();
          }
          const sceneQuery = new URLSearchParams(location.search).get("scene");
          if (sceneQuery && !isAudience) {
            const sceneIndex=mainHolds.findIndex(h=>h.sceneId===sceneQuery);
            if(sceneIndex>=0)go(sceneIndex,false,false);
            else {
              const appendixIndex=appendixHolds.findIndex(h=>h.id===sceneQuery);
              if(appendixIndex>=0){appendixMode=true;go(appendixIndex,false,false);}
            }
          }
          if (isAudience) channel?.postMessage({type:"audience-ready"});
        };
        player.addEventListener("ready", activate, {once:true});
        const wait = () => {
          if (typeof player.seek === "function" && typeof player.play === "function" && Number(player.duration || 0) > 0) activate();
          else if (!ready) setTimeout(wait, 80);
        };
        wait();
      }
      initialize();
      updateUi();
    </script>
  </body>
</html>
